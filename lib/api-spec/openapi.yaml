openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account authentication and role-specific dashboards
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create an account and send a verification link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInput"
      responses:
        "201":
          description: Account created; verification link logged by the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignUpResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: logIn
      tags: [auth]
      summary: Log in with a verified account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Email or password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Email address has not been verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/resend-verification:
    post:
      operationId: resendVerificationLink
      tags: [auth]
      summary: Request a fresh email verification link
      description: Accepts email and password and returns a generic result. A fresh link is generated only for a matching unverified account, and the link is returned to the browser only in development.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Generic resend result; development may include the verification link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignUpResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logOut
      tags: [auth]
      summary: Log out the current account
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
  /auth/verify:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify an email address using its one-time token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailInput"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "400":
          description: Verification link is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the authenticated account
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/creator/dashboard:
    get:
      operationId: getCreatorDashboard
      tags: [auth]
      summary: Get the creator dashboard account summary
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Creator account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Creator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [auth]
      summary: Get the admin dashboard account summary
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Admin account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: tsn_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SignUpInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 10
          maxLength: 128
      required: [name, email, password]
    LoginInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 128
      required: [email, password]
    VerifyEmailInput:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
      required: [token]
    AuthUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [CREATOR, ADMIN]
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, role, emailVerified, createdAt]
    AuthMessage:
      type: object
      properties:
        message:
          type: string
      required: [message]
    SignUpResult:
      type: object
      properties:
        message:
          type: string
        verificationUrl:
          type: string
          format: uri
      required: [message]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

