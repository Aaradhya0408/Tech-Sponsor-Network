openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Account authentication and role-specific dashboards
  - name: creator-profile
    description: Creator profile management
  - name: admin-creator-review
    description: Creator profile review and verification
  - name: admin-campaigns
    description: Admin-only campaign management
  - name: creator-campaigns
    description: Published campaigns available to creators
  - name: creator-applications
    description: Creator campaign applications
  - name: admin-applications
    description: Read-only campaign application review
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/signup:
    post:
      operationId: signUp
      tags: [auth]
      summary: Create an account and send a verification link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInput"
      responses:
        "201":
          description: Account created; verification link logged by the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignUpResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email is already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: logIn
      tags: [auth]
      summary: Log in with a verified account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Email or password is incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Email address has not been verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/resend-verification:
    post:
      operationId: resendVerificationLink
      tags: [auth]
      summary: Request a fresh email verification link
      description: Accepts email and password and returns a generic result. A fresh link is generated only for a matching unverified account, and the link is returned to the browser only in development.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Generic resend result; development may include the verification link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignUpResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request a password reset
      description: Always returns a generic response. In development, reset links are written to the API server logs; links are not returned to the browser.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestInput"
      responses:
        "200":
          description: Generic password reset request result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequestResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/password-reset/confirm:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password using a one-time token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetInput"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "400":
          description: Invalid or expired reset link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logOut
      tags: [auth]
      summary: Log out the current account
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
  /auth/verify:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify an email address using its one-time token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailInput"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "400":
          description: Verification link is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the authenticated account
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Current account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/creator/dashboard:
    get:
      operationId: getCreatorDashboard
      tags: [auth]
      summary: Get the creator dashboard account summary
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Creator account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Creator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [auth]
      summary: Get the admin dashboard account summary
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Admin account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /creator/profile:
    get:
      operationId: getCreatorProfile
      tags: [creator-profile]
      summary: Get the signed-in creator's profile
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Creator profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorProfile"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Creator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateCreatorProfile
      tags: [creator-profile]
      summary: Save the signed-in creator's profile
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorProfileInput"
      responses:
        "200":
          description: Saved creator profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorProfile"
        "400":
          description: Profile fields are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Creator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/creator-profiles:
    get:
      operationId: listAdminCreatorProfiles
      tags: [admin-creator-review]
      summary: List all creator profiles for review
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Creator profiles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCreatorProfiles"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/creator-profiles/{userId}/approval:
    patch:
      operationId: updateCreatorApproval
      tags: [admin-creator-review]
      summary: Approve or reject a creator profile
      security:
        - SessionCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorApprovalInput"
      responses:
        "200":
          description: Creator review updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "400":
          description: Approval decision is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creator not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/creator-profiles/{userId}/platforms/{platform}/verification:
    patch:
      operationId: updateCreatorPlatformVerification
      tags: [admin-creator-review]
      summary: Mark a creator platform link verified
      security:
        - SessionCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: platform
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/CreatorPlatform"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorPlatformVerificationInput"
      responses:
        "200":
          description: Platform link verification updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMessage"
        "400":
          description: Verification input is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Creator platform link not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /creator/campaigns:
    get:
      operationId: listCreatorCampaigns
      tags: [creator-campaigns]
      summary: List published campaigns available to creators
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Published campaigns with deadlines that have not passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCampaignList"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Creator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /creator/campaigns/{campaignId}:
    get:
      operationId: getCreatorCampaign
      tags: [creator-campaigns]
      summary: Get a published campaign available to creators
      security:
        - SessionCookie: []
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Published campaign with deadline that has not passed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCampaign"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Creator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Campaign not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /creator/applications:
    get:
      operationId: listCreatorApplications
      tags: [creator-applications]
      summary: List the signed-in creator's campaign applications
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Applications belonging to the signed-in creator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorCampaignApplicationList"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Creator role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /creator/campaigns/{campaignId}/applications:
    post:
      operationId: createCreatorCampaignApplication
      tags: [creator-applications]
      summary: Apply to an eligible published campaign
      description: A creator can apply once before the campaign deadline if their profile is approved and eligible.
      security:
        - SessionCookie: []
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignApplicationInput"
      responses:
        "201":
          description: Application submitted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatorCampaignApplication"
        "400":
          description: Application message or payment-rule acknowledgement is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Creator profile is not approved or eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Campaign is no longer available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Creator has already applied to this campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/applications:
    get:
      operationId: listAdminCampaignApplications
      tags: [admin-applications]
      summary: List campaign applications for administrators
      description: Application records, creator profile details, and decision history for administrators.
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Campaign applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCampaignApplicationList"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/applications/{applicationId}/decision:
    patch:
      operationId: updateAdminCampaignApplicationDecision
      tags: [admin-applications]
      summary: Accept, reject, or promote a campaign application
      description: Decisions are recorded with their actor and timestamp. Later decision changes require a reason and are appended to history.
      security:
        - SessionCookie: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignApplicationDecisionInput"
      responses:
        "200":
          description: Application decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignApplicationDecisionResult"
        "400":
          description: Decision data is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Application status cannot be changed from its current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/campaigns:
    get:
      operationId: listAdminCampaigns
      tags: [admin-campaigns]
      summary: List campaigns for administrators
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Campaign list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCampaignList"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminCampaign
      tags: [admin-campaigns]
      summary: Create a draft campaign
      security:
        - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Draft campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCampaign"
        "400":
          description: Campaign fields are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/campaigns/{campaignId}:
    patch:
      operationId: updateAdminCampaign
      tags: [admin-campaigns]
      summary: Edit campaign details
      security:
        - SessionCookie: []
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "200":
          description: Campaign updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCampaign"
        "400":
          description: Campaign fields are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/campaigns/{campaignId}/status:
    patch:
      operationId: updateAdminCampaignStatus
      tags: [admin-campaigns]
      summary: Publish, unpublish, or close a campaign
      security:
        - SessionCookie: []
      parameters:
        - name: campaignId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignStatusInput"
      responses:
        "200":
          description: Campaign status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCampaign"
        "400":
          description: Campaign status transition is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Campaign not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: tsn_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SignUpInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 10
          maxLength: 128
      required: [name, email, password]
    LoginInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 128
      required: [email, password]
    VerifyEmailInput:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
      required: [token]
    PasswordResetRequestInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
      required: [email]
    PasswordResetInput:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 32
          maxLength: 256
        newPassword:
          type: string
          minLength: 10
          maxLength: 128
      required: [token, newPassword]
    AuthUser:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [CREATOR, ADMIN]
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, role, emailVerified, createdAt]
    AuthMessage:
      type: object
      properties:
        message:
          type: string
      required: [message]
    SignUpResult:
      type: object
      properties:
        message:
          type: string
        verificationUrl:
          type: string
          format: uri
      required: [message]
    PasswordResetRequestResult:
      type: object
      properties:
        message:
          type: string
      required: [message]
    CreatorCountry:
      type: string
      minLength: 2
      maxLength: 2
      pattern: "^[A-Z]{2}$"
      description: ISO-style two-letter country or territory code
    CreatorCountryValue:
      type: string
      maxLength: 2
      pattern: "^([A-Z]{2})?$"
      description: ISO-style two-letter country or territory code, or empty before profile setup
    CreatorNiche:
      type: string
      enum: [Technology, AI, "Developer tools", Gaming, Education, Business, Other]
    CreatorPlatform:
      type: string
      enum: [Instagram, YouTube, LinkedIn, X, TikTok, GitHub]
    CreatorApprovalStatus:
      type: string
      enum: [PENDING_APPROVAL, APPROVED, REJECTED]
    CreatorApprovalDecision:
      type: string
      enum: [APPROVED, REJECTED]
    CreatorPlatformInput:
      type: object
      additionalProperties: false
      properties:
        platform:
          $ref: "#/components/schemas/CreatorPlatform"
        url:
          type: string
          format: uri
          maxLength: 2048
        followers:
          type: integer
